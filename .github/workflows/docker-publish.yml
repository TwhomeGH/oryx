name: Publish Docker Image (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Version comes from platform/version.go, e.g. v5.15.20
      - name: Generate version
        id: version
        run: echo "SRS_TAG=$(bash scripts/version.sh)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.SRS_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            # Immutable tag per build, e.g. sha-a1b2c3d — always available for rollback.
            type=sha,prefix=sha-

      # Prebuild zh/en UI on the runner, same as official release.yml,
      # then root Dockerfile packs them via MAKEARGS=build-no-ui.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build UI (cn + en)
        run: |
          cd ui && make build-cn -j && make build-en -j

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            MAKEARGS=build-no-ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disable provenance/sbom attestations: they are pushed as extra
          # UNTAGGED child manifests, which our cleanup workflow would delete,
          # breaking every tag pointing to the image index.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
