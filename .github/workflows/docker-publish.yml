name: Publish Docker Image (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Version comes from platform/version.go, e.g. v5.15.20
      - name: Generate version
        id: version
        run: echo "SRS_TAG=$(bash scripts/version.sh)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.SRS_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            # Immutable tag per build, e.g. sha-a1b2c3d — always available for rollback.
            type=sha,prefix=sha-

      # The root Dockerfile builds the UI itself from the source in the build context
      # (make -j build includes make -C ui), so no separate pre-build step is needed.
      # BuildKit caches the UI build by its inputs, keeping repeat builds fast.
      - name: Build Valkey image for validation
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disable provenance/sbom attestations: they are pushed as extra
          # UNTAGGED child manifests, which our cleanup workflow would delete,
          # breaking every tag pointing to the image index.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Valkey runtime in the release image
        env:
          RELEASE_IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          docker run --rm --network none --entrypoint bash \
            --mount "type=bind,source=$PWD/scripts/tools/test-kv-runtime.sh,target=/test.sh,readonly" \
            "$RELEASE_IMAGE" /test.sh

      - name: Prepare isolated Redis 5 migration test
        run: |
          docker pull redis:5.0.14
          docker pull golang:1.26

      - name: Verify Redis 5 to Valkey migration and rollback
        shell: pwsh
        env:
          RELEASE_IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          ./scripts/tools/test-redis-upgrade.ps1 -SourceImage redis:5.0.14 -TargetImage $env:RELEASE_IMAGE

      # Push the exact locally tested image, without rebuilding or re-resolving bases.
      - name: Push validated image tags
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then docker push "$tag"; fi
          done <<< "$RELEASE_TAGS"
