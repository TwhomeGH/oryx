name: Publish Docker Image (GHCR)

# Release model:
#   * push to main -> development images only: an immutable commit image (:sha-<sha>) and a
#     moving :edge pointer. No :latest and no version tag, so it is never mistaken for a release.
#   * tag vX.Y.Z   -> release images: the version tag (:vX.Y.Z) and the moving :latest.
#   * platform/version.go must equal the git tag; the workflow fails otherwise.
#   * Tagging is done for you by `scripts/bump-version.ps1 -Release` (bump + commit + tag + push).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Doc/tooling-only changes do not need an image build. Tag pushes always build.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/tools/**'
  workflow_dispatch:

# Cancel a superseded main build to save CI; never cancel a release (tag) build.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Guard: a release tag must match platform/version.go, so an image is never mislabelled.
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="$(bash scripts/version.sh)"
          want="${GITHUB_REF_NAME}"
          if [ "$ver" != "$want" ]; then
            echo "::error::platform/version.go ($ver) != git tag ($want). Run scripts/bump-version.ps1 -Release."
            exit 1
          fi
          echo "Release $ver"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Immutable per-commit image (dev + rollback), e.g. sha-a1b2c3d.
            type=sha,prefix=sha-
            # Moving dev pointer on the default branch.
            type=raw,value=edge,enable={{is_default_branch}}
            # Release: the git tag (vX.Y.Z) and the moving :latest, only when tagging v*.
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # The root Dockerfile builds the UI itself from the source in the build context
      # (make -j build includes make -C ui), so no separate pre-build step is needed.
      # BuildKit caches the UI build by its inputs, keeping repeat builds fast.
      - name: Build Valkey image for validation
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disable provenance/sbom attestations: they are pushed as extra
          # UNTAGGED child manifests, which our cleanup workflow would delete,
          # breaking every tag pointing to the image index.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Valkey runtime in the release image
        env:
          RELEASE_IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          docker run --rm --network none --entrypoint bash \
            --mount "type=bind,source=$PWD/scripts/tools/test-kv-runtime.sh,target=/test.sh,readonly" \
            "$RELEASE_IMAGE" /test.sh

      - name: Prepare isolated Redis 5 migration test
        run: |
          docker pull redis:5.0.14
          docker pull golang:1.26

      - name: Verify Redis 5 to Valkey migration and rollback
        shell: pwsh
        env:
          RELEASE_IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          ./scripts/tools/test-redis-upgrade.ps1 -SourceImage redis:5.0.14 -TargetImage $env:RELEASE_IMAGE

      # Push the exact locally tested image, without rebuilding or re-resolving bases.
      - name: Push validated image tags
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then docker push "$tag"; fi
          done <<< "$RELEASE_TAGS"
