              -check-api-secret=true -test.run WithStream
          } 2>&1 | tee test.log
          ret=${PIPESTATUS[0]}; echo "Test result: $ret"
          if [[ $ret -ne 0 ]]; then
            bash scripts/tools/github-test-annotations.sh "Test ZH installer" "$ret" test.log journalctl.log
