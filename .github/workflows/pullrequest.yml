name: Test Dev for PullRequest

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

concurrency:
  group: pullrequest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quiet-gate:
    name: quiet-gate
    runs-on: ubuntu-22.04
    # Debounce main/release-branch pushes: wait for 10 minutes without a newer push before
    # running the suite. PRs and release tags (v*) run immediately.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Wait for a 10-minute quiet window
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Waiting 10min for a quiet window; a newer push cancels this run."
          sleep 600
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Newer commit ${latest} exists; skipping this stale run."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
  envs:
    name: envs
    needs:
      - quiet-gate
    if: needs.quiet-gate.outputs.stale != 'true'
    steps:
      ##################################################################################################################
      # Git checkout
      - name: Checkout repository
        uses: actions/checkout@v6
      # The github.ref is, for example, refs/tags/v5.0.145 or refs/tags/v5.0-r8
      # Generate variables like:
      #   SRS_TAG=v1.0.52
      #   SRS_MAJOR=1
      # @see https://docs.github.com/en/actions/reference/workflow-commands-for-github-actions#setting-an-environment-variable
      - name: Generate varaiables
        run: |
          SRS_TAG=$(bash scripts/version.sh)
          echo "SRS_TAG=$SRS_TAG" >> $GITHUB_ENV
          SRS_MAJOR=$(echo $SRS_TAG| awk -F '.' '{print $1}' |sed 's/v//g')
          echo "SRS_MAJOR=$SRS_MAJOR" >> $GITHUB_ENV
          echo "SRS_TAG:$SRS_TAG, SRS_MAJOR:$SRS_MAJOR"
    # Map a step output to a job output, see https://docs.github.com/en/actions/using-jobs/defining-outputs-for-jobs
    outputs:
      SRS_TAG: ${{ env.SRS_TAG }}
      SRS_MAJOR: ${{ env.SRS_MAJOR }}
    runs-on: ubuntu-22.04

  check-tool-docs:
    name: Check tool script docs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      # Static check only: every scripts/tools/*.ps1 must have comment-based help and a
      # .PARAMETER entry for each parameter. Does not run the tools themselves.
      - name: Check PowerShell comment-based help
        shell: pwsh
        run: ./scripts/tools/check-ps1-docs.ps1

  run-test:
    name: Run UTest
    runs-on: ubuntu-22.04
    needs:
      - envs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download test file
        run: |
          curl --fail --location --output test/source.200kbps.768x320.flv \
            https://raw.githubusercontent.com/ossrs/srs/develop/doc/source.flv
          sz=$(stat -c%s test/source.200kbps.768x320.flv)
          echo "test input file: ${sz} bytes"
          if [ "$sz" -lt 1000000 ]; then
            echo "::error::test input file too small (${sz} bytes), download likely failed"
            exit 1
          fi
      - name: Setup the npm node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
      - name: Setup the Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          # The repo vendors its deps (platform/vendor, test/vendor), so Go never uses the module
          # cache, and setup-go's go.sum-based cache has nothing to key on at the repo root (which
          # produced "Restore cache failed: dependencies file is not found: go.mod"). Disable it
          # here and cache the Go build cache explicitly below instead.
          cache: false
      - name: Cache Go build
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('platform/go.sum', 'test/go.sum', 'releases/go.sum', 'platform/vendor/modules.txt', 'test/vendor/modules.txt') }}
          restore-keys: |
            ${{ runner.os }}-go-build-
      - name: Install tools
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ --strip-components=2 -C /usr/local/bin/ ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe
          ffmpeg -version
      - name: Test by jest and Go
        run: |
          make -j
          set +e
          make test -j 2>&1 | tee test.log
          ret=${PIPESTATUS[0]}
          if [ "$ret" -ne 0 ]; then
            bash scripts/tools/github-go-test-annotations.sh test.log
          fi
          exit "$ret"

  build-platform-image:
    name: Build platform image
    runs-on: ubuntu-22.04
    needs:
      - envs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build image for platform
        run: |
          docker build -t platform:latest -f Dockerfile .
          docker images
          docker save -o platform.tar platform:latest
      - name: Verify Valkey runtime
        run: |
          docker run --rm --network none --entrypoint bash \
            --mount "type=bind,source=$PWD/scripts/tools/test-kv-runtime.sh,target=/test.sh,readonly" \
            platform:latest /test.sh
      - uses: actions/upload-artifact@v6
        with:
          name: platform-cache
          path: platform.tar
          retention-days: 1

  test-zh-image:
    name: Test ZH image
    needs:
      - envs
      - build-platform-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download test file
        run: |
          curl --fail --location --output test/source.200kbps.768x320.flv \
            https://raw.githubusercontent.com/ossrs/srs/develop/doc/source.flv
          sz=$(stat -c%s test/source.200kbps.768x320.flv)
          echo "test input file: ${sz} bytes"
          if [ "$sz" -lt 1000000 ]; then
            echo "::error::test input file too small (${sz} bytes), download likely failed"
            exit 1
          fi
      - name: Install tools
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ --strip-components=2 -C /usr/local/bin/ ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe
          ffmpeg -version
      - uses: actions/download-artifact@v7
        with:
          name: platform-cache
      - name: Run test for platform image
        run: |
          docker load -i platform.tar
          docker tag platform ossrs/oryx:5
          docker run --rm -d -p 2022:2022 -p 2443:2443 -p 1935:1935 \
            -p 8000:8000/udp -p 10080:10080/udp --name oryx \
            -v /data:/data -e REACT_APP_LOCALE=zh ossrs/oryx:5
      - name: Check and Test service
        run: |
          # We will handle the error by ourselves.
          set +e
          
          # Record all logs.
          docker logs -f oryx >docker.log 2>&1 & pid_docker=$!
          
          {
          echo "Wait for service ready." &&
          make -j -C test &&
          bash scripts/tools/secret.sh --output test/.env &&
          ./test/oryx.test -test.timeout=1h -test.failfast -test.v -endpoint http://localhost:2022 \
              -srs-log=true -wait-ready=true -init-password=true -init-self-signed-cert=true \
              -check-api-secret=true -test.run TestSystem_Empty &&
          
          echo "Make upload writable." &&
          sudo chmod 777 /data/upload &&
          
          echo "Test HTTP service." &&
          bash scripts/tools/secret.sh --output test/.env &&
          ./test/oryx.test -test.timeout=1h -test.failfast -test.v -endpoint http://localhost:2022 \
              -srs-log=true -wait-ready=true -init-password=false -init-self-signed-cert=false \
              -check-api-secret=true -no-media-test &&
          
          echo "Test HTTPS service." &&
          bash scripts/tools/secret.sh --output test/.env &&
          ./test/oryx.test -test.timeout=1h -test.failfast -test.v -endpoint https://localhost:2443 \
              -srs-log=true -wait-ready=true -init-password=false -init-self-signed-cert=false \
              -check-api-secret=true -no-media-test &&
          
          echo "Run media test with retry" &&
          bash scripts/tools/secret.sh --output test/.env &&
          ./scripts/tools/failed-retry.sh 3 ./test/oryx.test -test.timeout=1h -test.failfast -test.v -endpoint http://localhost:2022 \
              -srs-log=true -wait-ready=true -init-password=false -init-self-signed-cert=false \
              -check-api-secret=true -test.run WithStream
          } 2>&1 | tee test.log
          ret=${PIPESTATUS[0]}; echo "Test result: $ret"
          if [[ $ret -ne 0 ]]; then
            bash scripts/tools/github-test-annotations.sh "Test ZH image" "$ret" test.log docker.log
          fi
          
          echo "Stop service"
          docker stop oryx
          kill $pid_docker 2>/dev/null
          echo "Log of docker.log" && cat docker.log
          
          exit $ret
    runs-on: ubuntu-22.04

