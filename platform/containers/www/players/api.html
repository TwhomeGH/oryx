<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oryx API 參考</title>
  <link rel="stylesheet" href="css/player.css?v=__ORYX_VER__">
  <link rel="stylesheet" href="api-docs.css?v=__ORYX_VER__">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="https://github.com/ossrs/srs" target="_blank" rel="noopener">SRS</a>
    <ul class="navbar-nav">
      <li><a href="srs_player.html">Live Player</a></li>
      <li><a href="rtc_player.html">WebRTC Player</a></li>
      <li><a href="whip.html">WHIP</a></li>
      <li><a href="whep.html">WHEP</a></li>
      <li><a href="pushdiag.html">Push Diag</a></li>
      <li><a class="active" href="api.html">API</a></li>
    </ul>
    <a class="nav-back" id="navBack" href="/mgmt/zh/routers-console">← 返回 Oryx 主控台</a>
  </div>
</nav>

<main class="container">
  <header class="api-header">
    <h1 id="apiTitle">API 參考</h1>
    <p class="text-dim" id="apiVersion">載入中…</p>
    <p class="text-dim fs-13" id="apiDesc"></p>
  </header>

  <section class="card">
    <div class="api-toolbar">
      <label class="form-label" for="tokenInput">API token</label>
      <input id="tokenInput" type="password" autocomplete="off" class="form-input" placeholder="貼上 token，curl 範例會帶入（只留在本頁）">
      <button id="tokenEye" type="button" class="btn btn-secondary btn-sm">顯示</button>
      <input id="apiFilter" type="search" class="form-input" placeholder="篩選路徑或說明…">
      <span class="text-dim fs-12" id="apiCount"></span>
    </div>
    <p class="text-dim fs-12 api-hint">
      這頁讀取 <code>/openapi.json</code>（由 <code>scripts/tools/gen-openapi.py</code> 從真實回應產生）。
      規格只涵蓋維運常用端點；全部端點見
      <a href="https://github.com/TwhomeGH/oryx/blob/main/docs/api-reference.md" target="_blank" rel="noopener">docs/api-reference.md</a>。
    </p>
  </section>

  <div id="apiError" class="card hidden"></div>
  <div id="apiGroups"></div>
</main>

<script src="js/api-nav.js?v=__ORYX_VER__"></script>
<script src="js/api-docs.js?v=__ORYX_VER__"></script>
</body>
</html>
