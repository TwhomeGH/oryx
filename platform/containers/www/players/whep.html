<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SRS WHEP Player</title>
    <link rel="stylesheet" href="css/player.css">
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a class="navbar-brand" href="https://github.com/ossrs/srs" target="_blank">SRS</a>
        <ul class="navbar-nav">
            <li><a href="srs_player.html">Live Player</a></li>
            <li><a href="whip.html">WHIP</a></li>
            <li><a class="active" href="whep.html">WHEP</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div id="info_alert" class="alert alert-info">
        <span>Enter a WebRTC WHEP URL and click Play.</span>
        <button class="alert-dismiss" onclick="this.parentElement.style.display='none'">&times;</button>
    </div>

    <div class="card">
        <div class="form-group">
            <label class="form-label" for="txt_url">WHEP URL</label>
            <div class="form-row">
                <input class="form-input" type="text" id="txt_url" placeholder="http://localhost:1985/rtc/v1/whep/?app=live&stream=livestream">
                <button class="btn btn-primary" id="btn_play">Play</button>
            </div>
        </div>

        <div class="player-wrapper">
            <video id="rtc_media_player" controls playsinline autoplay></video>
        </div>

        <div id="error_alert" class="alert alert-danger" style="display:none">
            <span id="error_msg"></span>
        </div>

        <div class="form-group" style="margin-top:16px">
            <label class="checkbox-label">
                <input type="checkbox" id="ch_videoonly"> Video Only
            </label>
            <label class="checkbox-label" style="margin-left:16px">
                <input type="checkbox" id="ch_audioonly"> Audio Only
            </label>
        </div>

        <div class="session-info" style="display:none" id="session_info">
            <div>SessionID: <span id="sessionid"></span></div>
            <div>Simulator: <a href="#" id="simulator-drop">Drop</a></div>
        </div>
    </div>

    <footer class="footer">
        <a href="https://github.com/ossrs/srs">SRS Team</a> &copy; 2013–2026
    </footer>
</div>

<script src="js/adapter-7.4.0.min.js"></script>
<script src="js/srs.sdk.js"></script>
<script src="js/winlin.utility.js"></script>
<script>
(function () {
    'use strict';

    var sdk = null;
    var videoEl = document.getElementById('rtc_media_player');
    var urlInput = document.getElementById('txt_url');
    var errorAlert = document.getElementById('error_alert');
    var errorMsg = document.getElementById('error_msg');
    var sessionInfo = document.getElementById('session_info');

    function showError(msg) {
        if (sdk) { sdk.close(); sdk = null; }
        errorMsg.textContent = msg;
        errorAlert.style.display = '';
        videoEl.style.display = 'none';
        sessionInfo.style.display = 'none';
    }

    function startPlay() {
        videoEl.style.display = '';
        errorAlert.style.display = 'none';

        if (sdk) sdk.close();
        sdk = new SrsRtcWhipWhepAsync();
        videoEl.srcObject = sdk.stream;

        var url = urlInput.value.trim();
        if (!url) return showError('Please enter a WHEP URL.');

        sdk.play(url, {
            videoOnly: document.getElementById('ch_videoonly').checked,
            audioOnly: document.getElementById('ch_audioonly').checked,
        }).then(function (session) {
            document.getElementById('sessionid').textContent = session.sessionid;
            var dropUrl = session.simulator + '?drop=1&username=' + encodeURIComponent(session.sessionid);
            document.getElementById('simulator-drop').href = dropUrl;
            sessionInfo.style.display = '';
        }).catch(function (reason) {
            sdk.close();
            sdk = null;
            showError(reason.toString() || 'WHEP play failed.');
        });
    }

    videoEl.style.display = 'none';
    var query = parse_query_string();
    srs_init_whep('#txt_url', query);

    document.getElementById('btn_play').addEventListener('click', startPlay);

    if (query.autostart === 'true') {
        videoEl.muted = true;
        window.addEventListener('load', function () { startPlay(); });
    }
})();
</script>
</body>
</html>
