<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SRS Player</title>
    <link rel="stylesheet" href="../players/css/player.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 960px; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <div id="preview_banner" class="preview-banner hidden"></div>

    <div class="card">
        <div class="form-group">
            <label class="form-label" for="txt_url">Stream URL</label>
            <div class="form-row">
                <input class="form-input" type="text" id="txt_url" placeholder="http://localhost:8080/live/livestream.flv">
                <button class="btn btn-primary" id="btn_play">Play</button>
            </div>
        </div>

        <div class="player-wrapper">
            <video id="video_player" 
                    controls 
                    webkit-playsinline
                    x5-playsinline
            ></video>
        </div>

        <div id="error_alert" class="alert alert-danger hidden">
            <span id="error_msg"></span>
        </div>
    </div>

    <div class="footer">
        <a href="https://github.com/ossrs/srs">SRS Team</a> &copy; 2013–2026
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<script>
(function () {
    'use strict';

    var PREVIEW_VIDEO = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
    var isPreview = window.location.protocol === 'file:';
    var player = null;
    var videoEl = document.getElementById('video_player');
    var urlInput = document.getElementById('txt_url');
    var errorAlert = document.getElementById('error_alert');
    var errorMsg = document.getElementById('error_msg');
    var previewBanner = document.getElementById('preview_banner');

    if (isPreview) {
        previewBanner.textContent = 'Running locally — using placeholder video for layout testing.';
        previewBanner.classList.remove('hidden');
        videoEl.classList.remove('hidden');
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            player = new Hls({ enableWorker: true });
            player.loadSource(PREVIEW_VIDEO);
            player.attachMedia(videoEl);
        } else {
            videoEl.src = PREVIEW_VIDEO;
        }
        return;
    }


    function sanitizeUrl(url) {
        try {
            const u = new URL(url, window.location.origin);
            // 僅允許 http/https
            if (u.protocol === "http:" || u.protocol === "https:") {
            return u.href;
            }
        } catch (e) {
            // 無效 URL
            console.error("Error Input SRC:",e)
        }
        return "about:blank"; // fallback
    }

    function showError(msg) {
        if (player) { try { player.destroy(); } catch (e) {} player = null; }
        errorMsg.textContent = msg;
        errorAlert.classList.remove('hidden');
    }

    function play(url) {
        if (player) { try { player.destroy(); } catch (e) {} player = null; }
        errorAlert.classList.add('hidden');

        if (url.indexOf('.m3u8') > 0) {
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                player = new Hls({
                    enableWorker: true, lowLatencyMode: true,
                    liveSyncDurationCount: 2, liveMaxLatencyDurationCount: 10,
                    maxBufferLength: 8, maxMaxBufferLength: 10,
                    maxLiveSyncPlaybackRate: 1.2, liveDurationInfinity: true
                });
                player.loadSource(url);
                player.attachMedia(videoEl);
                videoEl.play();
                return;
            }
            if (videoEl.canPlayType('application/vnd.apple.mpegURL')) {
                videoEl.src = url;
                return;
            }
            return showError('HLS is not supported.');
        }

        // HTTP-FLV or HTTP-TS
        if (mpegts && mpegts.getFeatureList().mseLivePlayback) {
            var type = url.indexOf('.ts') > 0 ? 'mpegts' : 'flv';
            player = mpegts.createPlayer({ type: type, url: url, isLive: true, enableStashBuffer: false });
            player.attachMediaElement(videoEl);
            player.load();
            player.play();
            return;
        }

        // Fallback to native
        let safeURL = sanitizeUrl(url)
        videoEl.src = safeURL;
    }

    document.getElementById('btn_play').addEventListener('click', function () {
        var url = urlInput.value.trim();
        if (!url) return showError('Please enter a URL.');
        play(url);
    });

    urlInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('btn_play').click();
    });

    // Auto-play from query string
    if (!isPreview) {
        var q = new URLSearchParams(location.search);
        var resource = q.get('url');
        if (resource) {
            urlInput.value = resource;
            play(resource);
        }
    }
})();
</script>
</body>
</html>
